<style>

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

 if(t==='moon')return `<div class="moons">${[1,2,3,4,5].map(n=>B(n,moon(n))).join('')}</div><div class="lab">${WD[v]||''}</div>`;

INTRO,
{t:()=>'چه زمانی و در کدام برنامه شرکت کردید؟',s:()=>'تاریخ شرکت و نام برنامه را مشخص کنید.',r:()=>`<h2>تاریخ شرکت در برنامه</h2><div class="dt"><select data-k="jd">${opts(Array.from({length:31},(_,i)=>[i+1,fa(i+1)]),S.jd)}</select><select data-k="jm">${opts(PM.map((n,i)=>[i+1,n]),S.jm)}</select><select data-k="jy">${opts([t0[0]-1,t0[0]].map(y=>[y,fa(y)]),S.jy)}</select></div><div class="err" id="de"></div><h2>نام برنامه</h2>`+(S.prog?`<div class="sel"><span>${e(P[S.prog]||'')}</span><button type="button" data-t="clr" aria-label="تغییر">✕</button></div>`:`<input id="ps" type="text" placeholder="بخشی از نام برنامه را بنویسید..." autocomplete="off"><div id="pl" style="margin-top:8px"></div>`),v:()=>!!iso(S.jy,S.jm,S.jd)&&!!S.prog},

{t:()=>'تجربهٔ شما از نزدیک',s:()=>'چند انتخاب سریع؛ همه اختیاری هستند',r:()=>`<h2>کدام بخش برایتان جذاب‌تر بود؟ (چند گزینه)</h2><div class="cards">${HI.map(([i,l])=>`<button type="button" class="cd ${S.hi.includes(l)?'on':''}" data-t="mc" data-v="${l}"><b>${i}</b>${l}</button>`).join('')}</div><h2>با چه کسانی آمدید؟</h2><div class="cards">${WHO.map(([i,l])=>`<button type="button" class="cd ${S.who===l?'on':''}" data-t="one" data-k="who" data-v="${l}"><b>${i}</b>${l}</button>`).join('')}</div><h2>از کجا با انگاریوم آشنا شدید؟</h2><div class="cards">${SRC.map(([i,l])=>`<button type="button" class="cd ${S.src===l?'on':''}" data-t="one" data-k="src" data-v="${l}"><b>${i}</b>${l}</button>`).join('')}</div>`,v:()=>true},
{t:()=>'پیشنهاد شما',s:()=>'آخرین مرحله',r:()=>`<h2>چه پیشنهادی برای بهبود برنامه‌ها و خدمات انگاریوم دارید؟</h2><textarea data-k="improve" rows="5" placeholder="پیشنهاد یا انتقاد شما (اختیاری)">${e(S.improve)}</textarea><h2>${lowAny()?'شمارهٔ تماس برای پیگیری نظر شما (اختیاری، پیشنهاد می‌شود)':'شمارهٔ تماس (اختیاری)'}</h2><input type="tel" inputmode="tel" data-k="phone" value="${e(S.phone)}" placeholder="۰۹۱۲۰۰۰۰۰۰۰"><div class="err" id="pe"></div><input data-k="hp" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">`,v:()=>phoneN()!==null,n:'ارسال نظر'}
];

function dome(k){$('dome').innerHTML=`<path d="M8 126A192 120 0 0 1 392 126Z" fill="rgba(124,156,255,.07)" stroke="rgba(255,255,255,.28)"/>`+N.slice(1,k).map((p,i)=>`<line x1="${N[i][0]}" y1="${N[i][1]}" x2="${p[0]}" y2="${p[1]}" stroke="rgba(255,200,87,.6)"/>`).join('')+N.map((p,i)=>i<k?`<circle cx="${p[0]}" cy="${p[1]}" r="11" fill="#ffc857" opacity=".18"/><circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="#ffc857"/>`:`<circle cx="${p[0]}" cy="${p[1]}" r="2" fill="#fff" opacity=".4"/>`).join('')}

 dome(7);const v=QS.map(([k])=>S.q[k]||3);
 const Pt=[[40,100],[90,50],[140,95],[190,40],[235,90],[270,45],[300,100],[320,60]];
 const lines=Pt.slice(1).map((p,i)=>`<line x1="${Pt[i][0]}" y1="${Pt[i][1]}" x2="${p[0]}" y2="${p[1]}" stroke="rgba(255,255,255,.35)"/>`).join('');
 const dots=Pt.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${7+v[i]*3}" fill="#ffc857" opacity=".12"/><circle cx="${p[0]}" cy="${p[1]}" r="${2+v[i]*2.2}" fill="#ffc857"/>`).join('');
 $('card').className='card thanks';
 $('card').innerHTML=`<h1>سپاس از نظر شما</h1><p class="sub">این صورت فلکی را پاسخ‌های شما ساخته؛ ستارهٔ بزرگ‌تر یعنی نمرهٔ بالاتر.</p><svg viewBox="0 0 340 150" role="img" aria-label="صورت فلکی نظر شما">${lines}${dots}</svg><p class="sub">نظر شما مستقیم به تیم برنامه‌ریزی انگاریوم می‌رسد. آسمان صاف!</p>`;scrollTo(0,0);
}
// آسمان
const cv=$('sky'),cx=cv.getContext('2d');let st=[],sh=null,mx=0,my=0;
function size(){cv.width=innerWidth;cv.height=innerHeight;st=Array.from({length:Math.min(140,Math.floor(innerWidth/5))},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.3+.2,p:Math.random()*6.3,z:Math.random()+.2}))}
addEventListener('pointermove',ev=>{mx=ev.clientX/innerWidth-.5;my=ev.clientY/innerHeight-.5});
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function draw(t){cx.clearRect(0,0,cv.width,cv.height);cx.fillStyle='#fff';
 for(const s of st){cx.globalAlpha=.35+.65*Math.abs(Math.sin(t/1400+s.p));cx.beginPath();cx.arc(s.x+mx*s.z*28,s.y+my*s.z*28,s.r,0,6.3);cx.fill()}
 if(!still){if(!sh&&Math.random()<.004)sh={x:Math.random()*cv.width*.7,y:Math.random()*cv.height*.4,l:0};
  if(sh){cx.globalAlpha=1-sh.l/60;cx.strokeStyle='#fff';cx.beginPath();cx.moveTo(sh.x,sh.y);cx.lineTo(sh.x-30,sh.y-13);cx.stroke();sh.x+=9;sh.y+=4;if(++sh.l>60)sh=null}requestAnimationFrame(draw)}}
addEventListener('resize',size);size();requestAnimationFrame(draw);
if(P[qp])S.prog=qp;
show();
// اتصال به دیتابیس بعد از نمایش صفحه (بدون مسدود کردن بارگذاری)
function loadSB(){const sc=document.createElement('script');sc.src='supabase.js';sc.async=true;
 sc.onload=async()=>{try{sb=supabase.createClient(CFG.url,CFG.key);
  const{data}=await sb.from('programs').select('*').eq('active',true).order('name');
  if(data&&data.length){const t=new Date(),td=t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());
   P={};data.filter(p=>(!p.starts_on||p.starts_on<=td)&&(!p.ends_on||p.ends_on>=td)).forEach(p=>P[p.id]=p.name);
   if(S.prog&&!P[S.prog])S.prog='';if(P[qp])S.prog=qp;
   if(idx===1)show();else upd()}
 }catch(x){}};
 document.head.appendChild(sc)}
setTimeout(loadSB,30);
